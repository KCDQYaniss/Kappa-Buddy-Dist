<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kappa Buddy Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      background-color: rgba(0, 0, 0, 0);
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: "Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
/* L'ATTRIBUT data-theme sur <html> suit le thème choisi dans l'app
   (localStorage["theme"], Partagé par les webviews de même origine) :
   dark (défaut), light, cyberpunk. Les variables reflètent ui/style.css. */
:root, [data-theme="dark"] {
  --card-rgb: 10, 15, 11;      /* --bg */
  --panel-soft: rgba(0, 0, 0, 0.27);
  --ink: #eae8d9;
  --text: #c3c3bf;
  --dim: #8b8a80;
  --field: #2c2c29;
  --line: #2a2a25;
  --line-hi: #6b6a60;
  --cream: #f1edc8;
  --cream-d: #d6d1a4;
  --orange: #cc8245;
  --lime: #86dc35;
  --amber: #e2b24a;
  --red: #c9573f;
  --name-font: "Chakra Petch", sans-serif;
}
[data-theme="light"] {
  --card-rgb: 233, 237, 226;   /* fond papier sauge */
  --panel-soft: rgba(0, 0, 0, 0.06);
  --ink: #23261c;
  --text: #3c4034;
  --dim: #75796a;
  --field: #f7f9f3;
  --line: #c4c9b8;
  --line-hi: #a8ad9a;
  --cream: #4a6b2a;
  --cream-d: #3a5522;
  --orange: #b06a2c;
  --lime: #5a8c1f;
  --amber: #8f6a1d;
  --red: #a03a24;
  --name-font: "Chakra Petch", sans-serif;
}
[data-theme="cyberpunk"] {
  --card-rgb: 4, 4, 21;
  --panel-soft: rgba(0, 0, 0, 0.35);
  --ink: #f0f0ff;
  --text: #c2b2ff;
  --dim: #7a7ac4;
  --field: #1a1a2e;
  --line: #1a1a2e;
  --line-hi: #5a5a8e;
  --cream: #ffe6f0;
  --cream-d: #ffcae0;
  --orange: #ff9a8b;
  --lime: #00ffcc;
  --amber: #fff08a;
  --red: #ff4a75;
  --name-font: "Orbitron", "Chakra Petch", sans-serif;
}

@font-face { font-family: "Chakra Petch"; font-weight: 400; src: url("fonts/ChakraPetch-Regular.ttf") format("truetype"); }
@font-face { font-family: "Chakra Petch"; font-weight: 500; src: url("fonts/ChakraPetch-Medium.ttf") format("truetype"); }
@font-face { font-family: "Chakra Petch"; font-weight: 600; src: url("fonts/ChakraPetch-SemiBold.ttf") format("truetype"); }
@font-face { font-family: "Orbitron"; font-weight: 400; src: url("fonts/Orbitron-Regular.ttf") format("truetype"); }
* { box-sizing: border-box; }

body {
  pointer-events: none;
  display: block;
  margin: 0;
  font-family: "Chakra Petch", "Segoe UI", sans-serif;
}
.hidden { display: none !important; }
/* L'attribut hidden est écrasé par .o-row { display:flex } (règle d'auteur
   > feuille du navigateur) : sans ceci, les lignes/sections restent
   affichées même quand le JS les masque. */
[hidden] { display: none !important; }

/* Palette du thème courant : fond charbon (opacité configurable via
   --bg-a), texte/liseré issus des variables au-dessus. L'ÉCHELLE DU TEXTE
   est pilotée par --k (0.7 → 2.0) : chaque taille en dérive par calc(). */
.cursor-overlay {
  position: relative;
  width: 320px;
  --bg-a: 0.95;
  --k: 1;
  background: rgba(var(--card-rgb), var(--bg-a));
  border: 1px solid var(--line-hi);
  border-radius: 6px;
  color: var(--ink);
  font-size: calc(13px * var(--k));
  line-height: 1.35;
  overflow: hidden;
  display: block;
}
.o-header {
  display: flex; align-items: center; gap: 8px;
  padding: calc(7px * var(--k)) calc(10px * var(--k)) calc(6px * var(--k));
  border-bottom: 1px solid var(--line);
  background: var(--panel-soft);
}
.o-icon {
  width: calc(26px * var(--k)); height: calc(26px * var(--k)); flex-shrink: 0;
  background: var(--field); border-radius: 3px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  border: 1px solid var(--line);
}
.o-name {
  font-size: calc(13px * var(--k)); font-weight: 600; color: var(--ink);
  font-family: var(--name-font);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 250px; line-height: 1.2; margin: 0;
}
.o-name.placeholder { color: var(--dim); font-weight: 400; }
.o-sub { font-size: calc(10px * var(--k)); color: var(--dim); }
.o-body { padding: calc(5px * var(--k)) calc(10px * var(--k)) calc(7px * var(--k)); }
.o-sec { border-top: 1px solid var(--line); padding: calc(2px * var(--k)) 0; }
.o-sec:first-child { border-top: none; }
.o-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: calc(2px * var(--k)) 0; }
.o-label { color: var(--dim); font-size: calc(11px * var(--k)); white-space: nowrap; flex-shrink: 0; }
.o-value {
  font-weight: 600; color: var(--cream); font-size: calc(12px * var(--k));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.o-value.dim { color: var(--text); font-weight: 400; }
.o-dim {
  color: var(--dim); font-size: calc(10px * var(--k));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: calc(1px * var(--k)) 0;
}
.up { color: var(--lime); }
.down { color: var(--red); }
.o-list { padding: calc(1px * var(--k)) 0; }
.o-line {
  font-size: calc(11px * var(--k)); color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: calc(1.5px * var(--k)) 0;
}
.o-line .lq { color: var(--cream); font-weight: 600; }
.o-line .done { color: var(--dim); text-decoration: line-through; }
.o-line .failed { color: var(--red); text-decoration: line-through; }
.o-flag { color: var(--cream-d); }
.o-kappa { color: var(--cream); font-weight: 700; }
.o-bad { color: var(--orange); }
.o-more { color: var(--dim); font-size: calc(10px * var(--k)); }
  </style>
</head>
<body>
  <div id="cursor-overlay" class="cursor-overlay hidden">
    <div class="o-header">
      <div id="overlay-icon" class="o-icon"></div>
      <div>
        <h3 id="overlay-name" class="o-name placeholder">Objet…</h3>
        <div id="overlay-sub" class="o-sub hidden"></div>
      </div>
    </div>
    <div class="o-body" id="overlay-body">
      <!-- Flea -->
      <div class="o-sec" data-sec="flea">
        <div class="o-row">
          <span class="o-label">Flea</span>
          <span class="o-value"><span id="overlay-flea">—</span> <span id="flea-trend"></span></span>
        </div>
      </div>
      <div class="o-dim" data-sec="flea_history" id="overlay-flea-history"></div>
      <!-- Meilleur marchand -->
      <div class="o-sec" data-sec="traders">
        <div class="o-row">
          <span id="overlay-trader-label" class="o-label">Meilleur</span>
          <span id="overlay-trader" class="o-value">—</span>
        </div>
      </div>
      <div class="o-dim" data-sec="traders_all" id="overlay-traders-all"></div>
      <!-- Prix par emplacement (+ /kg) -->
      <div class="o-sec" data-sec="slot">
        <div class="o-row">
          <span class="o-label">Slot</span>
          <span id="overlay-slot" class="o-value">—</span>
        </div>
      </div>
      <div class="o-dim o-caliber" data-sec="caliber" id="overlay-caliber"></div>
      <!-- Quêtes -->
      <div class="o-sec" data-sec="quests" id="sec-quests">
        <div class="o-row"><span class="o-label">Quête</span></div>
        <div class="o-list" id="overlay-quest-list"></div>
      </div>
      <!-- Barter : l'obtenir -->
      <div class="o-sec" data-sec="barter" id="sec-barter">
        <div class="o-row"><span class="o-label">Barter</span></div>
        <div class="o-list" id="overlay-barter-list"></div>
      </div>
      <!-- Barter : où DÉPENSER l'objet -->
      <div class="o-sec" data-sec="barter_using" id="sec-barter-using">
        <div class="o-row"><span class="o-label">Échangé</span></div>
        <div class="o-list" id="overlay-barter-using-list"></div>
      </div>
      <!-- Planque (améliorations requises) -->
      <div class="o-sec" data-sec="hideout" id="sec-hideout">
        <div class="o-row"><span class="o-label">Planque</span></div>
        <div class="o-list" id="overlay-hideout-list"></div>
      </div>
      <!-- Craft (recettes qui le produisent) -->
      <div class="o-sec" data-sec="crafts" id="sec-crafts">
        <div class="o-row"><span class="o-label">Craft</span></div>
        <div class="o-list" id="overlay-craft-list"></div>
      </div>
      <!-- Achat marchand (off par défaut) -->
      <div class="o-sec" data-sec="buy" id="sec-buy">
        <div class="o-row"><span class="o-label">Acheter</span><span id="overlay-buy" class="o-value">—</span></div>
      </div>
      <!-- Texte brut lu par l'OCR (off par défaut) -->
      <div class="o-sec" data-sec="raw">
        <div class="o-row">
          <span class="o-label">Lu</span>
          <span id="overlay-raw" class="o-value dim">—</span>
        </div>
      </div>
    </div>
  </div>

  <script>
  "use strict";
  const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : null;
  const $ = (id) => document.getElementById(id);
  let isVisible = false;
  let lastSeq = 0;
  let hideTimer = null;
  // Sections par défaut : tout visible sauf « Acheter » et « Lu » (discrets).
  const DEFAULT_SECTIONS = { flea: 1, flea_history: 1, traders: 1, traders_all: 1, slot: 1, quests: 1, barter: 1, barter_using: 1, hideout: 1, crafts: 1, buy: 0, raw: 0 };
  let cfg = { opacity: 0.95, scale: 1, sections: Object.assign({}, DEFAULT_SECTIONS) };

  function fitWindow() {
    if (!invoke) return;
    requestAnimationFrame(() => {
      const r = $("cursor-overlay").getBoundingClientRect();
      invoke("set_overlay_size", { width: Math.ceil(r.width) + 2, height: Math.ceil(r.height) + 2 }).catch(() => {});
    });
  }
  function show() {
    isVisible = true;
    $("cursor-overlay").classList.remove("hidden");
    // set_size réaffiche la fenêtre côté Windows : c'est voulu ici, la carte
    // est en train d'apparaître. On ne l'appelle donc jamais depuis hide().
    fitWindow();
  }
  function hide() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if (isVisible) {
      isVisible = false;
      $("cursor-overlay").classList.add("hidden");
      if (invoke) invoke("hide_overlay").catch(() => {});
    }
  }
  function forceHide() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if (isVisible) { isVisible = false; if (invoke) invoke("hide_overlay").catch(() => {}); }
    $("cursor-overlay").classList.add("hidden");
  }

  /* ---------- Formatage (style Tarkov : nombre + ₽) ---------- */
  const NF = () => new Intl.NumberFormat(navigator.language || "fr-FR");
  function fmtP(p) { return (p == null || p === 0) ? "—" : NF().format(Math.round(p)) + " ₽"; }
  /** Format compact des listes secondaires : 22 000 → 22 k. */
  function fmtK(p) {
    if (p == null) return "—";
    const n = Math.round(p);
    return n >= 100000 ? Math.round(n / 1000).toLocaleString() + " k"
      : n >= 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + " k"
      : n.toLocaleString();
  }
  function fmtSlot(p, w, h) { const slots = Math.max(1, (w || 1) * (h || 1)); return (p == null || !slots) ? "—" : NF().format(Math.floor(p / slots)) + " ₽"; }
  function fmtKg(p, kg) { return (p == null || !kg) ? "" : NF().format(Math.floor(p / kg)) + " ₽/kg"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function truncate(s, n) { s = String(s || ""); return s.length > n ? s.substring(0, n) + "…" : s; }

  /* ---------- Configuration (fenêtre + sections + style) ---------- */
  function applyCfg(c) {
    if (!c) return;
    const root = $("cursor-overlay");
    if (typeof c.opacity === "number" && c.opacity > 0 && c.opacity <= 1) {
      root.style.setProperty("--bg-a", String(c.opacity));
    }
    if (typeof c.scale === "number" && c.scale >= 0.7 && c.scale <= 2) {
      root.style.setProperty("--k", String(c.scale));
    }
    if (c.sections && typeof c.sections === "object") {
      // Les clés ABSENTES du payload tombent sur le défaut persisté : le
      // backend ne renvoie JAMAIS une section inventée.
      for (const k of Object.keys(DEFAULT_SECTIONS)) {
        cfg.sections[k] = typeof c.sections[k] === "boolean" ? (c.sections[k] ? 1 : 0) : cfg.sections[k];
      }
    }
    // Visibilité immédiate des sections (aucun contenu réécrit).
    document.querySelectorAll("[data-sec]").forEach((el) => {
      const key = el.getAttribute("data-sec");
      if (key in cfg.sections) el.hidden = !cfg.sections[key];
    });
  }

  /* ---------- Rendu des données ---------- */
  function trend(pct) {
    const el = $("flea-trend");
    if (!el) return;
    if (typeof pct !== "number" || !isFinite(pct)) { el.textContent = ""; return; }
    const p = Math.abs(pct) < 0.05 ? 0 : pct;
    const cls = p > 0 ? "up" : p < 0 ? "down" : "";
    el.innerHTML = cls
      ? `<span class="${cls}">${p > 0 ? "↗" : "↘"} ${Math.abs(p).toFixed(1)}%</span>`
      : "";
  }

  function questLine(t) {
    if (!t || !t.name) return "";
    const st = t.task_status;
    const nameCls = st === "completed" ? " done " : st === "failed" ? " failed " : " lq ";
    const bits = [];
    if (typeof t.count === "number" && t.count > 1) bits.push("×" + t.count);
    if (t.fir) bits.push(`<span class="o-flag" title="Found in Raid requis">⚑</span>`);
    if (t.kappa_required) bits.push(`<span class="o-kappa" title="Requis pour Kappa">κ</span>`);
    if (st === "completed") bits.push(`<span class="done">✓</span>`);
    if (st === "failed") bits.push(`<span class="failed">✗</span>`);
    const lab = t.trader ? `<span class="o-sub">${esc(t.trader)}</span> ` : "";
    return `<div class="o-line">${lab}<span class="${nameCls}">${esc(truncate(t.name, 26))}</span> ${bits.join(" ")}</div>`;
  }

  function barterLine(b) {
    if (!b) return "";
    const items = (b.items || []).map((i) => (i.count || 1) + "× " + esc(truncate(i.name, 18))).join(" + ");
    return `<div class="o-line"><span class="lq">${esc(b.trader)}</span> niv${b.level ?? 1} ${items ? ": " + items : ""}</div>`;
  }

  function barterUsingLine(b) {
    if (!b) return "";
    const rw = (b.rewards || []).map((i) => (i.count || 1) + "× " + esc(truncate(i.name, 20))).join(" + ");
    return `<div class="o-line">→ <span class="lq">${esc(b.trader)}</span> niv${b.level ?? 1} ${rw ? ": " + rw : ""}</div>`;
  }

  function hideoutLines(list) {
    const max = 3;
    const shown = (list || []).slice(0, max);
    const lines = shown.map((h) => {
      if (!h) return "";
      const fir = h.fir ? ` <span class="o-flag">⚑</span>` : "";
      return `<div class="o-line">${esc(truncate(h.station, 20))} niv${h.level ?? 1} — ${h.count}×${fir}</div>`;
    }).filter(Boolean);
    if ((list || []).length > max) lines.push(`<div class="o-more">+${list.length - max} autres…</div>`);
    return lines.join("");
  }

  function craftLine(c, extraCount) {
    if (!c) return "";
    const items = (c.items || []).map((i) => (i.count || 1) + "× " + esc(truncate(i.name, 18))).join(" + ");
    const dur = c.duration_sec ? "~" + Math.max(1, Math.round(c.duration_sec / 3600)) + "h" : "";
    const more = extraCount > 0 ? ` +${extraCount}` : "";
    return `<div class="o-line"><span class="lq">${esc(truncate(c.station, 16))}</span> niv${c.level ?? 1} ${dur}${more}</div>` +
           (items ? `<div class="o-line o-sub">← ${items}</div>` : "");
  }

  function tradersAll(sell_for, bestName) {
    const others = (sell_for || []).filter((s) => s && s.name !== bestName).slice(0, 4);
    if (!others.length) return "";
    return others.map((s) => `${esc(truncate(s.name, 12))} ${fmtK(s.price)}`).join(" · ");
  }

  /** Efface TOUTES les données : état neutre autorisé avant la prochaine valeur. */
  function clearData() {
    const ids = ["overlay-flea", "flea-trend", "overlay-flea-history", "overlay-trader", "overlay-traders-all",
      "overlay-slot", "overlay-caliber", "overlay-quest-list", "overlay-barter-list", "overlay-barter-using-list",
      "overlay-hideout-list", "overlay-craft-list", "overlay-buy", "overlay-raw", "overlay-sub"];
    ids.forEach((id) => { const el = $(id); if (el) el.innerHTML = ""; });
    $("overlay-caliber").textContent = "";
    ["sec-quests", "sec-barter", "sec-barter-using", "sec-hideout", "sec-crafts"].forEach((id) => { $(id).hidden = true; });
  }

  function renderResult(d) {
    d = d || {};
    applyCfg(d.cfg);
    const hasItem = !!(d.item_name || d.short_name);
    const n = d.item_name || d.short_name || (d.raw_text ? d.raw_text.trim() : "");
    $("overlay-name").textContent = n ? truncate(n, 30) : (hasItem ? "" : "Objet non reconnu");
    $("overlay-name").classList.toggle("placeholder", !d.item_name && !d.short_name);
    $("overlay-icon").style.backgroundImage = d.icon ? "url(\"" + d.icon + "\")" : "";
    // Sous-titre : calibre/ammo pack/quelle info utile
    const sub = $("overlay-sub");
    const subBits = [];
    if (d.caliber_display) subBits.push("⌖ " + esc(d.caliber_display));
    if (d.ammo_pack_round_name) subBits.push(esc(truncate(d.ammo_pack_round_name, 22)));
    if (d.weight) subBits.push(esc(d.weight) + " kg");
    // Transparence : dire quand la lecture vient d'une boîte de secours et non
    // de la principale — un « miroir »/« élargie » sur un faux voisin explique
    // tout de suite le désaccord.
    if (d.attempt === "mirror") subBits.push('\u29c9 Miroir');
    else if (d.attempt === "wide") subBits.push('\u29c9 Zone élargie');
    sub.className = "o-sub" + (subBits.length ? "" : " hidden");
    sub.innerHTML = subBits.join(" · ");

    const r = d; // result aliases
    $("overlay-flea").textContent = fmtP(r.flea_price);
    trend(r.flea_change_48h_pct);
    const hist = [];
    if (r.flea_low_24h != null || r.flea_high_24h != null) {
      hist.push("24h " + fmtK(r.flea_low_24h) + " – " + fmtK(r.flea_high_24h));
    }
    if (r.flea_last_offer_count != null) hist.push(r.flea_last_offer_count + " offres");
    $("overlay-flea-history").textContent = hist.join(" · ");

    // Meilleur marchand : sell_for trie déjà du plus haut au plus bas.
    const best = Array.isArray(r.sell_for) && r.sell_for.length ? r.sell_for[0] : null;
    $("overlay-trader-label").textContent = best ? "Meilleur" : "Marchand";
    $("overlay-trader").textContent = best
      ? `${esc(best.name)} — ${fmtP(best.price)}`
      : fmtP(r.trader_price);
    $("overlay-traders-all").textContent = best ? tradersAll(r.sell_for, best.name) : "";

    $("overlay-slot").textContent = fmtSlot(r.flea_price, r.width, r.height);
    $("overlay-caliber").textContent = d.caliber_display ? "⌖ " + esc(d.caliber_display) : "";

    const q = (r.used_in_tasks || []).filter(Boolean);
    $("sec-quests").hidden = !cfg.sections.quests || !q.length;
    if (q.length) {
      const max = 3;
      $("overlay-quest-list").innerHTML = q.slice(0, max).map(questLine).join("") +
        (q.length > max ? `<div class="o-more">+${q.length - max} autres…</div>` : "");
    }

    const br = (r.barters_for || []).filter(Boolean);
    $("sec-barter").hidden = !cfg.sections.barter || !br.length;
    if (br.length) {
      $("overlay-barter-list").innerHTML = barterLine(br[0]) +
        (br.length > 1 ? `<div class="o-more">+${br.length - 1} autres…</div>` : "");
    }

    const bu = (r.barters_using || []).filter(Boolean);
    $("sec-barter-using").hidden = !cfg.sections.barter_using || !bu.length;
    if (bu.length) $("overlay-barter-using-list").innerHTML = barterUsingLine(bu[0]);

    const hd = (r.needed_for_hideout || []).filter(Boolean);
    $("sec-hideout").hidden = !cfg.sections.hideout || !hd.length;
    if (hd.length) $("overlay-hideout-list").innerHTML = hideoutLines(hd);

    const cf = (r.crafts_for || []).filter(Boolean);
    $("sec-crafts").hidden = !cfg.sections.crafts || !cf.length;
    if (cf.length) $("overlay-craft-list").innerHTML = craftLine(cf[0], cf.length - 1);

    const bf = (r.buy_for || []).filter(Boolean);
    if (bf.length) {
      $("overlay-buy").textContent = `${esc(bf[0].name)} niv${bf[0].min_level ?? 1} — ${fmtP(bf[0].price)}`;
    } else { $("overlay-buy").textContent = "—"; }

    $("overlay-raw").textContent = truncate((r.raw_text || "").trim() || "—", 44);
    show();
    fitWindow();
  }

  function renderInfo(msg, secs) {
    // Message court sur la carte (mode auto, infos) sans données d'objet faux.
    $("overlay-name").textContent = truncate(msg || "", 30);
    $("overlay-name").classList.add("placeholder");
    $("overlay-icon").style.backgroundImage = "";
    $("overlay-sub").className = "o-sub hidden";
    clearData();
    $("overlay-flea").textContent = "—";
    $("overlay-trader").textContent = "—";
    $("overlay-slot").textContent = "—";
    show();
    fitWindow();
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if ((secs || 3) > 0) hideTimer = setTimeout(hide, (secs || 3) * 1000);
  }

  function showLoading() {
    $("overlay-name").textContent = "Lecture…";
    $("overlay-name").classList.add("placeholder");
    $("overlay-icon").style.backgroundImage = "";
    $("overlay-sub").className = "o-sub hidden";
    clearData();
    $("overlay-flea").textContent = $("overlay-trader").textContent = $("overlay-slot").textContent = "—";
    $("overlay-raw").textContent = "";
    show();
    fitWindow();
  }

  function showError(msg, secs) {
    $("overlay-name").textContent = truncate(msg || "Erreur de lecture", 30);
    $("overlay-name").classList.remove("placeholder");
    $("overlay-icon").style.backgroundImage = "";
    $("overlay-sub").className = "o-sub hidden";
    clearData();
    $("overlay-flea").textContent = $("overlay-trader").textContent = $("overlay-slot").textContent = "—";
    $("overlay-raw").textContent = "";
    show();
    fitWindow();
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if ((secs || 8) > 0) hideTimer = setTimeout(hide, (secs || 8) * 1000);
  }

  async function poll() {
    if (!invoke) return;
    try {
      const data = await invoke("get_overlay_data");
      if (!data) return;
      // Le backend incrémente `seq` à CHAQUE nouvelle capture : un payload déjà
      // traité (même statut, même résultat) a le même seq et est ignoré. C'est
      // ce qui supprime le spam sans jamais bloquer les captures suivantes.
      const seq = data.seq || 0;
      if (seq <= lastSeq) return;
      lastSeq = seq;

      const status = data.status || "";
      if (status === "config") {
        applyCfg(data.cfg);
        if (isVisible) fitWindow(); // les sections/échelles changent la hauteur
      } else if (status === "loading") {
        applyCfg(data.cfg);
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        showLoading();
      } else if (status === "ok") {
        applyCfg(data.cfg);
        renderResult(data.result || {});
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        const secs = data.autohide || 0;
        if (secs > 0) hideTimer = setTimeout(hide, secs * 1000);
      } else if (status === "show") {
        show();
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        const secs = data.autohide || 0;
        if (secs > 0) hideTimer = setTimeout(hide, secs * 1000);
      } else if (status === "auto-on") {
        renderInfo("Mode auto : activé", data.autohide || 3);
      } else if (status === "auto-off") {
        renderInfo("Mode auto : désactivé", data.autohide || 3);
      } else if (status === "hide") {
        forceHide();
      } else if (status === "error") {
        showError(data.message || "Erreur de lecture", data.autohide);
      } else if (status === "not-in-game") {
        showError("Lance Tarkov d'abord", data.autohide || 4);
      }
    } catch (e) {}
  }

  /** La carte suit le thème de l'app : localStorage["theme"] est partagé par
      les webviews de même origine ; l'événement « storage » arrive quand
      l'utilisateur change de thème dans la fenêtre principale. */
  function applyOverlayTheme() {
    let t = null;
    try { t = localStorage.getItem("theme"); } catch {}
    document.documentElement.dataset.theme = (t === "light" || t === "cyberpunk") ? t : "dark";
  }
  window.addEventListener("storage", (e) => {
    if (!e.key || e.key === "theme") applyOverlayTheme();
  });
  applyOverlayTheme();

  setInterval(poll, 200);
  // Au chargement, la carte est masquée par défaut : on cache aussi la fenêtre
  // OS. Ne PAS appeler fitWindow() ici — set_size réafficherait la fenêtre et
  // laisserait un rectangle vide à l'écran.
  forceHide();
  </script>
</body>
</html>
