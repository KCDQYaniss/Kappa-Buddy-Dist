[package]
name = "tarkov-core"
version = "0.1.0"
edition = "2021"
description = "Logique indépendante de Tauri : parsing des screenshots/logs et surveillance des fichiers."

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
